name: Compilar APK
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  apk:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Crear proyecto Android
        run: |
          mkdir www
          cp index.html manifest.webmanifest icon-192.png icon-512.png www/
          npm init -y
          npm install @capacitor/core@6 @capacitor/cli@6 @capacitor/android@6
          cat > capacitor.config.json <<'EOF'
          {
            "appId": "com.vinilo.app",
            "appName": "Vinilo",
            "webDir": "www"
          }
          EOF
          npx cap add android
      - name: Añadir código nativo (leer música y portadas)
        run: |
          D=android/app/src/main/java/com/vinilo/app
          cat > $D/MainActivity.java <<'EOF'
          package com.vinilo.app;

          import android.os.Bundle;
          import androidx.activity.OnBackPressedCallback;
          import com.getcapacitor.BridgeActivity;

          public class MainActivity extends BridgeActivity {
              @Override
              public void onCreate(Bundle savedInstanceState) {
                  registerPlugin(MusicLibraryPlugin.class);
                  super.onCreate(savedInstanceState);
                  getOnBackPressedDispatcher().addCallback(this, new OnBackPressedCallback(true) {
                      @Override
                      public void handleOnBackPressed() {
                          if (getBridge() == null || getBridge().getWebView() == null) {
                              moveTaskToBack(true);
                              return;
                          }
                          getBridge().getWebView().evaluateJavascript(
                              "(window.__back ? window.__back() : false)",
                              v -> {
                                  if (!"true".equals(v)) moveTaskToBack(true);
                              });
                      }
                  });
              }

              @Override
              public void onPause() {
                  super.onPause();
                  if (getBridge() != null && getBridge().getWebView() != null) {
                      getBridge().getWebView().onResume();
                      getBridge().getWebView().resumeTimers();
                  }
              }
          }
          EOF
          cat > $D/KeepAliveService.java <<'EOF'
          package com.vinilo.app;

          import android.app.Notification;
          import android.app.NotificationChannel;
          import android.app.NotificationManager;
          import android.app.PendingIntent;
          import android.app.Service;
          import android.content.Context;
          import android.content.Intent;
          import android.content.pm.ServiceInfo;
          import android.graphics.Bitmap;
          import android.media.MediaMetadata;
          import android.media.session.MediaSession;
          import android.media.session.PlaybackState;
          import android.os.Build;
          import android.os.IBinder;
          import android.os.PowerManager;

          public class KeepAliveService extends Service {
              interface Ctl { void onAction(String action, long posMs); }

              static volatile boolean running = false;
              static volatile KeepAliveService inst = null;
              static volatile Ctl ctl = null;
              static volatile String title = "Vinilo";
              static volatile String artist = "";
              static volatile Bitmap cover = null;
              static volatile boolean playing = false;
              static volatile long posMs = 0;
              static volatile long durMs = 0;

              private PowerManager.WakeLock wl;
              private MediaSession session;

              @Override
              public IBinder onBind(Intent i) {
                  return null;
              }

              private void send(String a, long p) {
                  Ctl c = ctl;
                  if (c != null) c.onAction(a, p);
              }

              @Override
              public int onStartCommand(Intent intent, int flags, int startId) {
                  if (intent != null && intent.getAction() != null && intent.getAction().startsWith("vinilo.")) {
                      String a = intent.getAction().substring(7);
                      if (a.equals("stop")) {
                          stopForeground(true);
                          stopSelf();
                      } else {
                          send(a, 0);
                      }
                      return START_NOT_STICKY;
                  }
                  String ch = "vinilo_playback";
                  NotificationManager nm = (NotificationManager) getSystemService(Context.NOTIFICATION_SERVICE);
                  if (Build.VERSION.SDK_INT >= 26) {
                      nm.createNotificationChannel(new NotificationChannel(ch, "Reproduccion", NotificationManager.IMPORTANCE_LOW));
                  }
                  if (session == null) {
                      session = new MediaSession(this, "Vinilo");
                      session.setCallback(new MediaSession.Callback() {
                          @Override public void onPlay() { send("play", 0); }
                          @Override public void onPause() { send("pause", 0); }
                          @Override public void onSkipToNext() { send("next", 0); }
                          @Override public void onSkipToPrevious() { send("prev", 0); }
                          @Override public void onSeekTo(long pos) { send("seek", pos); }
                      });
                      session.setActive(true);
                  }
                  inst = this;
                  if (Build.VERSION.SDK_INT >= 29) {
                      startForeground(1, build(), ServiceInfo.FOREGROUND_SERVICE_TYPE_MEDIA_PLAYBACK);
                  } else {
                      startForeground(1, build());
                  }
                  running = true;
                  apply();
                  return START_NOT_STICKY;
              }

              private Notification.Action act(int icon, String text, String a, int code) {
                  Intent i = new Intent(this, KeepAliveService.class).setAction("vinilo." + a);
                  PendingIntent pi = PendingIntent.getService(this, code, i,
                      PendingIntent.FLAG_IMMUTABLE | PendingIntent.FLAG_UPDATE_CURRENT);
                  return new Notification.Action.Builder(icon, text, pi).build();
              }

              private Notification build() {
                  Intent open = new Intent(this, MainActivity.class);
                  open.setFlags(Intent.FLAG_ACTIVITY_SINGLE_TOP | Intent.FLAG_ACTIVITY_CLEAR_TOP);
                  PendingIntent pi = PendingIntent.getActivity(this, 0, open,
                      PendingIntent.FLAG_IMMUTABLE | PendingIntent.FLAG_UPDATE_CURRENT);
                  Intent stop = new Intent(this, KeepAliveService.class).setAction("vinilo.stop");
                  PendingIntent del = PendingIntent.getService(this, 9, stop,
                      PendingIntent.FLAG_IMMUTABLE | PendingIntent.FLAG_UPDATE_CURRENT);
                  Notification.Builder b = Build.VERSION.SDK_INT >= 26
                      ? new Notification.Builder(this, "vinilo_playback")
                      : new Notification.Builder(this);
                  b.setSmallIcon(android.R.drawable.ic_media_play)
                      .setContentTitle(title)
                      .setContentText(artist)
                      .setContentIntent(pi)
                      .setDeleteIntent(del)
                      .setOngoing(playing)
                      .setOnlyAlertOnce(true)
                      .setVisibility(Notification.VISIBILITY_PUBLIC);
                  if (cover != null) b.setLargeIcon(cover);
                  b.addAction(act(android.R.drawable.ic_media_previous, "Anterior", "prev", 1));
                  if (playing) b.addAction(act(android.R.drawable.ic_media_pause, "Pausa", "pause", 2));
                  else b.addAction(act(android.R.drawable.ic_media_play, "Reproducir", "play", 3));
                  b.addAction(act(android.R.drawable.ic_media_next, "Siguiente", "next", 4));
                  b.setStyle(new Notification.MediaStyle()
                      .setMediaSession(session.getSessionToken())
                      .setShowActionsInCompactView(0, 1, 2));
                  return b.build();
              }

              void apply() {
                  if (session == null) return;
                  MediaMetadata.Builder mb = new MediaMetadata.Builder()
                      .putString(MediaMetadata.METADATA_KEY_TITLE, title)
                      .putString(MediaMetadata.METADATA_KEY_ARTIST, artist)
                      .putLong(MediaMetadata.METADATA_KEY_DURATION, durMs);
                  if (cover != null) {
                      mb.putBitmap(MediaMetadata.METADATA_KEY_ALBUM_ART, cover);
                      mb.putBitmap(MediaMetadata.METADATA_KEY_ART, cover);
                  }
                  session.setMetadata(mb.build());
                  long acts = PlaybackState.ACTION_PLAY | PlaybackState.ACTION_PAUSE | PlaybackState.ACTION_PLAY_PAUSE
                      | PlaybackState.ACTION_SKIP_TO_NEXT | PlaybackState.ACTION_SKIP_TO_PREVIOUS | PlaybackState.ACTION_SEEK_TO;
                  session.setPlaybackState(new PlaybackState.Builder()
                      .setActions(acts)
                      .setState(playing ? PlaybackState.STATE_PLAYING : PlaybackState.STATE_PAUSED, posMs, playing ? 1f : 0f)
                      .build());
                  if (playing) {
                      if (wl == null) {
                          PowerManager pm = (PowerManager) getSystemService(Context.POWER_SERVICE);
                          wl = pm.newWakeLock(PowerManager.PARTIAL_WAKE_LOCK, "vinilo:playback");
                      }
                      if (!wl.isHeld()) wl.acquire();
                  } else if (wl != null && wl.isHeld()) {
                      wl.release();
                  }
                  NotificationManager nm = (NotificationManager) getSystemService(Context.NOTIFICATION_SERVICE);
                  nm.notify(1, build());
              }

              @Override
              public void onTaskRemoved(Intent rootIntent) {
                  stopSelf();
                  super.onTaskRemoved(rootIntent);
              }

              @Override
              public void onDestroy() {
                  running = false;
                  inst = null;
                  if (wl != null && wl.isHeld()) wl.release();
                  wl = null;
                  if (session != null) {
                      session.release();
                      session = null;
                  }
                  super.onDestroy();
              }
          }
          EOF
          cat > $D/MusicLibraryPlugin.java <<'EOF'
          package com.vinilo.app;

          import android.Manifest;
          import android.content.ContentUris;
          import android.content.Intent;
          import android.database.Cursor;
          import android.graphics.Bitmap;
          import android.graphics.BitmapFactory;
          import android.net.Uri;
          import android.os.Build;
          import android.provider.MediaStore;
          import android.util.Base64;
          import android.util.Size;
          import com.getcapacitor.JSArray;
          import com.getcapacitor.JSObject;
          import com.getcapacitor.PermissionState;
          import com.getcapacitor.Plugin;
          import com.getcapacitor.PluginCall;
          import com.getcapacitor.PluginMethod;
          import com.getcapacitor.annotation.CapacitorPlugin;
          import com.getcapacitor.annotation.Permission;
          import com.getcapacitor.annotation.PermissionCallback;
          import java.io.ByteArrayOutputStream;

          @CapacitorPlugin(
              name = "MusicLibrary",
              permissions = {
                  @Permission(alias = "audio", strings = { Manifest.permission.READ_MEDIA_AUDIO }),
                  @Permission(alias = "storage", strings = { Manifest.permission.READ_EXTERNAL_STORAGE }),
                  @Permission(alias = "notifications", strings = { Manifest.permission.POST_NOTIFICATIONS })
              }
          )
          public class MusicLibraryPlugin extends Plugin {

              private String alias() {
                  return Build.VERSION.SDK_INT >= 33 ? "audio" : "storage";
              }

              @PluginMethod
              public void requestAccess(PluginCall call) {
                  boolean audioOk = getPermissionState(alias()) == PermissionState.GRANTED;
                  boolean notifAsk = Build.VERSION.SDK_INT >= 33
                      && getPermissionState("notifications") == PermissionState.PROMPT;
                  if (audioOk && !notifAsk) {
                      JSObject o = new JSObject();
                      o.put("granted", true);
                      call.resolve(o);
                      return;
                  }
                  String[] al = Build.VERSION.SDK_INT >= 33
                      ? new String[] { "audio", "notifications" }
                      : new String[] { "storage" };
                  requestPermissionForAliases(al, call, "permResult");
              }

              @Override
              public void load() {
                  KeepAliveService.ctl = (a, p) -> {
                      JSObject o = new JSObject();
                      o.put("action", a);
                      o.put("pos", p / 1000.0);
                      notifyListeners("mediaAction", o);
                  };
              }

              @PluginMethod
              public void updateMedia(PluginCall call) {
                  KeepAliveService.title = call.getString("title", "Vinilo");
                  KeepAliveService.artist = call.getString("artist", "");
                  KeepAliveService.playing = Boolean.TRUE.equals(call.getBoolean("playing", false));
                  Double pos = call.getDouble("pos", 0.0);
                  Double dur = call.getDouble("dur", 0.0);
                  KeepAliveService.posMs = (long) (pos * 1000);
                  KeepAliveService.durMs = (long) (dur * 1000);
                  if (call.hasOption("cover")) {
                      Bitmap bmp = null;
                      String c = call.getString("cover", "");
                      if (c != null && c.length() > 0) {
                          try {
                              byte[] by = Base64.decode(c, Base64.DEFAULT);
                              bmp = BitmapFactory.decodeByteArray(by, 0, by.length);
                          } catch (Exception e) {
                              bmp = null;
                          }
                      }
                      KeepAliveService.cover = bmp;
                  }
                  KeepAliveService s = KeepAliveService.inst;
                  if (s != null) s.apply();
                  call.resolve();
              }

              @PluginMethod
              public void keepAlive(PluginCall call) {
                  boolean on = Boolean.TRUE.equals(call.getBoolean("on", false));
                  try {
                      Intent i = new Intent(getContext(), KeepAliveService.class);
                      if (on) {
                          if (!KeepAliveService.running) {
                              if (Build.VERSION.SDK_INT >= 26) getContext().startForegroundService(i);
                              else getContext().startService(i);
                          }
                      } else {
                          getContext().stopService(i);
                      }
                      call.resolve();
                  } catch (Exception e) {
                      call.reject("keepAlive: " + e.getMessage());
                  }
              }

              @PermissionCallback
              private void permResult(PluginCall call) {
                  JSObject o = new JSObject();
                  o.put("granted", getPermissionState(alias()) == PermissionState.GRANTED);
                  call.resolve(o);
              }

              @PluginMethod
              public void scan(PluginCall call) {
                  new Thread(() -> {
                      try {
                          JSArray arr = new JSArray();
                          Uri base = MediaStore.Audio.Media.EXTERNAL_CONTENT_URI;
                          String[] proj = {
                              MediaStore.Audio.Media._ID,
                              MediaStore.Audio.Media.TITLE,
                              MediaStore.Audio.Media.ARTIST,
                              MediaStore.Audio.Media.DISPLAY_NAME,
                              MediaStore.Audio.Media.SIZE
                          };
                          Cursor c = getContext().getContentResolver().query(
                              base, proj, "(" + MediaStore.Audio.Media.IS_MUSIC + " != 0 OR " + MediaStore.Audio.Media.DURATION + " >= 45000) AND "
                              + MediaStore.Audio.Media.IS_RINGTONE + " = 0 AND " + MediaStore.Audio.Media.IS_ALARM + " = 0 AND "
                              + MediaStore.Audio.Media.IS_NOTIFICATION + " = 0", null,
                              MediaStore.Audio.Media.TITLE + " COLLATE NOCASE ASC");
                          if (c != null) {
                              try {
                                  while (c.moveToNext()) {
                                      long id = c.getLong(0);
                                      JSObject o = new JSObject();
                                      o.put("id", id);
                                      o.put("title", c.getString(1));
                                      o.put("artist", c.getString(2));
                                      o.put("displayName", c.getString(3));
                                      o.put("size", c.getLong(4));
                                      o.put("uri", ContentUris.withAppendedId(base, id).toString());
                                      arr.put(o);
                                  }
                              } finally {
                                  c.close();
                              }
                          }
                          JSObject res = new JSObject();
                          res.put("songs", arr);
                          call.resolve(res);
                      } catch (Exception e) {
                          call.reject("scan: " + e.getMessage());
                      }
                  }).start();
              }

              @PluginMethod
              public void cover(PluginCall call) {
                  final String u = call.getString("uri");
                  new Thread(() -> {
                      JSObject o = new JSObject();
                      try {
                          if (Build.VERSION.SDK_INT >= 29 && u != null) {
                              Bitmap b = getContext().getContentResolver()
                                  .loadThumbnail(Uri.parse(u), new Size(320, 320), null);
                              ByteArrayOutputStream bo = new ByteArrayOutputStream();
                              b.compress(Bitmap.CompressFormat.JPEG, 85, bo);
                              o.put("data", Base64.encodeToString(bo.toByteArray(), Base64.NO_WRAP));
                          }
                      } catch (Exception e) {
                          // sin portada
                      }
                      call.resolve(o);
                  }).start();
              }
          }
          EOF
          sed -i 's#</manifest>#    <uses-permission android:name="android.permission.READ_MEDIA_AUDIO" />\n    <uses-permission android:name="android.permission.READ_EXTERNAL_STORAGE" android:maxSdkVersion="32" />\n    <uses-permission android:name="android.permission.FOREGROUND_SERVICE" />\n    <uses-permission android:name="android.permission.FOREGROUND_SERVICE_MEDIA_PLAYBACK" />\n    <uses-permission android:name="android.permission.POST_NOTIFICATIONS" />\n    <uses-permission android:name="android.permission.WAKE_LOCK" />\n</manifest>#' android/app/src/main/AndroidManifest.xml
          sed -i 's#</application>#    <service android:name=".KeepAliveService" android:exported="false" android:foregroundServiceType="mediaPlayback" />\n    </application>#' android/app/src/main/AndroidManifest.xml
          rm -rf android/app/src/main/res/mipmap-anydpi-v26
          for d in android/app/src/main/res/mipmap-*; do
            cp icon-192.png $d/ic_launcher.png
            cp icon-192.png $d/ic_launcher_round.png
            cp icon-192.png $d/ic_launcher_foreground.png
          done
      - name: Compilar
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: vinilo-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
      - uses: softprops/action-gh-release@v2
        continue-on-error: true
        with:
          tag_name: apk-${{ github.run_number }}
          name: Vinilo APK ${{ github.run_number }}
          files: android/app/build/outputs/apk/debug/app-debug.apk
