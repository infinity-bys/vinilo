<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1a1424">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<title>Vinilo · Reproductor</title>
<style>
:root{--bg:#1a1424;--panel:#251d33;--line:#3a2f4d;--text:#f1e9dc;--mute:#a79bb8;--acc:#f2a53a;--acc2:#e8644f;--r:18px}
*{box-sizing:border-box;margin:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{background:var(--bg);color:var(--text);font:15px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
button:focus-visible,input:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
.app{display:grid;gap:16px;padding:16px;max-width:1000px;margin:0 auto;min-height:100%;grid-template-columns:minmax(0,1fr)}
.player{position:relative;isolation:isolate}
.pbg{position:absolute;inset:0;border-radius:inherit;z-index:-1;opacity:0;transition:opacity .6s ease;pointer-events:none}
@media(min-width:820px){.app{grid-template-columns:380px minmax(0,1fr);align-items:start;padding:28px;gap:28px}.player{position:sticky;top:28px}}
.player{min-width:0;background:var(--panel);border:1px solid var(--line);border-radius:28px;padding:22px;display:flex;flex-direction:column;align-items:center;gap:14px}
.disc{width:min(62vw,250px);aspect-ratio:1;border-radius:50%;position:relative;background:repeating-radial-gradient(circle at 50% 50%,#120d1a 0 2px,#1d1528 2px 4px);box-shadow:0 14px 40px #0008;animation:spin 6s linear infinite paused}
.playing .disc{animation-play-state:running}
.disc::before{content:"";position:absolute;inset:31%;border-radius:50%;background:radial-gradient(circle,#1a1424 0 7%,transparent 8%),linear-gradient(135deg,var(--acc),var(--acc2))}
.disc::after{content:"";position:absolute;inset:0;border-radius:50%;background:conic-gradient(from 30deg,transparent 0 20%,#ffffff14 25%,transparent 30% 70%,#ffffff14 75%,transparent 80%)}
@keyframes spin{to{transform:rotate(360deg)}}
@media(prefers-reduced-motion:reduce){.disc{animation:none}}
.lab{position:absolute;inset:26%;border-radius:50%;background:center/cover no-repeat;display:none}
.lab.on{display:block}
.lab::after{content:"";position:absolute;inset:45%;border-radius:50%;background:var(--bg)}
.add.alt{background:none;color:var(--acc);border:1px solid var(--acc)}
.top{display:none;width:100%;align-items:center;gap:10px;color:var(--mute);font-size:14px}
.back{width:42px;height:42px;border-radius:50%;display:grid;place-items:center;background:var(--bg);color:var(--text)}
.ctrl button svg,.mini button svg{width:1.15em;height:1.15em}
.mini{display:none;position:fixed;left:12px;right:12px;bottom:calc(12px + env(safe-area-inset-bottom));z-index:5;background:var(--panel);border:1px solid var(--line);border-radius:22px;padding:8px 8px 8px 10px;align-items:center;gap:6px;box-shadow:0 10px 30px #0009;overflow:hidden}
.mprog{position:absolute;left:0;top:0;height:3px;width:0;background:linear-gradient(90deg,var(--acc),var(--acc2))}
.mini .mt{flex:1;min-width:0;display:flex;align-items:center;gap:12px;text-align:left}
.md{width:42px;height:42px;border-radius:50%;flex:none;background:radial-gradient(circle,#1a1424 0 9%,transparent 10%),linear-gradient(135deg,var(--acc),var(--acc2));box-shadow:0 0 0 5px #120d1a}
.playing .md{animation:spin 6s linear infinite}
.mtx{min-width:0;display:flex;flex-direction:column}
.mtx b{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mtx small{color:var(--mute);font-size:12px}
.mini .ic{width:44px;height:44px;border-radius:50%;font-size:20px;display:grid;place-items:center;flex:none}
.mini .pl{background:linear-gradient(135deg,var(--acc),var(--acc2));color:#1a1424}
@media(max-width:819px){
  .v-list .player,.v-player .lib{display:none}
  .top{display:flex}
  .v-list.has .mini{display:flex}
  .v-list.has .lib{padding-bottom:96px}
}
canvas{width:100%;height:42px;display:block}
.info{text-align:center;width:100%;min-width:0}
.mq{width:100%;overflow:hidden;text-align:center;-webkit-mask-image:linear-gradient(90deg,transparent,#000 6%,#000 94%,transparent);mask-image:linear-gradient(90deg,transparent,#000 6%,#000 94%,transparent)}
.info h2{display:inline-block;font:600 21px/1.25 Georgia,"Times New Roman",serif;white-space:nowrap;padding:0 4px}
.mq.run{text-align:left}
.mq.run h2{animation:mq var(--t,8s) ease-in-out infinite alternate}
@keyframes mq{0%,18%{transform:translateX(0)}82%,100%{transform:translateX(var(--d))}}
@media(prefers-reduced-motion:reduce){.mq.run h2{animation:none;max-width:100%;overflow:hidden;text-overflow:ellipsis}}
.info p{color:var(--mute);font-size:13px;margin-top:2px}
.seek{width:100%;display:flex;align-items:center;gap:10px;font-size:12px;color:var(--mute);font-variant-numeric:tabular-nums}
input[type=range]{-webkit-appearance:none;appearance:none;flex:1;height:5px;border-radius:5px;background:linear-gradient(90deg,var(--acc) var(--p,0%),var(--line) var(--p,0%));min-width:0}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:16px;height:16px;border-radius:50%;background:var(--text);border:3px solid var(--acc)}
input[type=range]::-moz-range-thumb{width:12px;height:12px;border-radius:50%;background:var(--text);border:3px solid var(--acc)}
.ctrl{display:flex;align-items:center;justify-content:center;gap:10px;width:100%}
.ctrl button{width:46px;height:46px;border-radius:50%;font-size:19px;display:grid;place-items:center;color:var(--mute)}
.ctrl button.on{color:var(--acc)}
.ctrl .main{width:68px;height:68px;font-size:26px;background:linear-gradient(135deg,var(--acc),var(--acc2));color:#1a1424;box-shadow:0 8px 22px #e8644f55}
.lib{min-width:0}
.bar{display:flex;gap:10px;margin-bottom:12px;align-items:center}
.bar h1{font:700 26px Georgia,serif;flex:1}
.add{background:var(--acc);color:#1a1424;font-weight:700;padding:11px 16px;border-radius:14px;white-space:nowrap}
.search{width:100%;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:12px 14px;color:var(--text);font:inherit;margin-bottom:12px}
.count{color:var(--mute);font-size:13px;margin-bottom:8px}
ul{list-style:none;padding:0;display:grid;grid-template-columns:minmax(0,1fr);gap:6px}
li{min-width:0;display:flex;align-items:center;gap:12px;padding:10px 10px 10px 12px;border-radius:14px;background:var(--panel);border:1px solid transparent}
li.cur{border-color:var(--acc)}
li .t{flex:1;min-width:0;overflow:hidden;text-align:left;display:flex;align-items:center;gap:12px}
li .n{width:36px;height:36px;border-radius:10px;background:var(--line);display:grid;place-items:center;font-size:14px;flex:none}
li.cur .n{background:var(--acc);color:#1a1424}
li .nm{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
li .sz{color:var(--mute);font-size:12px}
li .x{color:var(--mute);font-size:18px;width:38px;height:38px;border-radius:50%}
li .x:hover{color:var(--acc2)}
.empty{text-align:center;color:var(--mute);padding:44px 20px;border:2px dashed var(--line);border-radius:var(--r)}
.empty b{display:block;color:var(--text);font:600 18px Georgia,serif;margin-bottom:6px}
.drop{outline:2px dashed var(--acc);outline-offset:-8px}
.top span{flex:1}
.extra{width:100%;display:flex;justify-content:space-between;align-items:center;margin-top:auto;padding-top:18px}
.pbtn{flex:none;display:flex;align-items:center;justify-content:center;gap:8px;height:52px;min-width:52px;padding:0 16px;border-radius:26px;background:var(--bg);border:1px solid var(--line);color:var(--mute);font:600 14px/1 system-ui,sans-serif;white-space:nowrap;transition:color .2s,border-color .2s,background .2s,transform .15s}
.pbtn:active{transform:scale(.94)}
.pbtn svg{flex:none}
.pbtn span:empty{display:none}
.ctrl button{color:var(--text)}
.ctrl #prev svg,.ctrl #next svg{width:26px;height:26px}
.ctrl #prev,.ctrl #next,.mini #mNext{color:var(--soft,var(--text))}
.ctrl .main{box-shadow:0 8px 22px color-mix(in srgb,var(--acc2) 33%,transparent)}
#pEq.on,#pMode.on{background:color-mix(in srgb,var(--acc) 14%,transparent)}
.ctrl .main svg{width:30px;height:30px}
.ctrl #pFav,.ctrl #pMore{color:var(--mute)}
.ctrl #pFav.on{color:var(--acc2)}
.ctrl #pFav.on svg{fill:currentColor}
.ctrl #pMore{position:relative}
.ctrl #pMore.on{color:var(--acc)}
#spLbl{position:absolute;top:3px;right:-5px;font:700 10px/1 system-ui,sans-serif;background:var(--acc);color:#1a1424;padding:3px 5px;border-radius:8px}
#spLbl:empty{display:none}
#pEq.on,#pMode.on{color:var(--acc);border-color:var(--acc);background:#f2a53a1f}
.gear{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;color:var(--mute);flex:none}
.gear.on{color:var(--acc)}
.toast{position:fixed;left:50%;bottom:calc(96px + env(safe-area-inset-bottom));transform:translateX(-50%);background:var(--panel);border:1px solid var(--line);color:var(--text);padding:10px 18px;border-radius:999px;font-size:14px;opacity:0;pointer-events:none;transition:opacity .25s;z-index:30;white-space:nowrap}
.toast.show{opacity:1}
.pres{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:10px}
.sheet .pres button{display:inline-block;width:auto;padding:7px 14px;border-radius:999px;text-align:center;font-size:13px}
.eqr{display:flex;align-items:center;gap:12px;padding:9px 2px}
.eqr span{width:58px;font-size:13px;color:var(--mute);flex:none}
.eqr b{width:56px;text-align:right;font-size:13px;flex:none}
.mh{display:flex;align-items:center;gap:14px;padding:2px 4px 14px;margin-bottom:6px;border-bottom:1px solid var(--line)}
.mthumb{width:56px;height:56px;border-radius:14px;flex:none;background:linear-gradient(135deg,var(--acc),var(--acc2))}
.mht{min-width:0;display:flex;flex-direction:column}
.mht b{font:600 17px Georgia,serif;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mht small{color:var(--mute);font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sheet button.row{display:flex;align-items:center;gap:14px}
.row>svg:first-child{color:var(--acc)}
.row .rl{flex:1}
.row .rv{color:var(--mute);font-size:14px}
.row.sel .rl{color:var(--acc);font-weight:700}
.row .ck{opacity:0;color:var(--acc)}
.row.sel .ck{opacity:1}
.chips{display:flex;gap:8px;margin-bottom:10px}
.chip{padding:7px 14px;border-radius:999px;border:1px solid var(--line);color:var(--mute);font-size:13px}
.chip.on{background:var(--acc);color:#1a1424;border-color:var(--acc);font-weight:700}
.sheet{position:fixed;inset:0;background:#000a;display:none;align-items:flex-end;justify-content:center;z-index:20}
.sheet.show{display:flex}
.sheet .box{background:var(--panel);width:100%;max-width:480px;border-radius:22px 22px 0 0;padding:18px 16px calc(18px + env(safe-area-inset-bottom))}
.sheet h3{font:600 18px Georgia,serif;margin-bottom:10px}
.sheet button{display:block;width:100%;text-align:left;padding:13px 12px;border-radius:12px;font-size:15px;color:var(--text)}
.sheet button:active{background:var(--line)}
.sheet button.off{color:var(--acc2)}
</style>
</head>
<body>
<div class="app v-list" id="app">
  <section class="player" aria-label="Reproductor">
    <div class="pbg" id="pbg"></div>
    <div class="top"><button class="back" id="back" aria-label="Volver a la lista"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9l6 6 6-6"/></svg></button><span>Reproduciendo</span></div>
    <div class="disc" aria-hidden="true"><div class="lab" id="lab"></div></div>
    <canvas id="viz" aria-hidden="true"></canvas>
    <div class="info"><div class="mq" id="mq"><h2 id="title">Elige una canción</h2></div><p id="sub">Tu música, sin conexión</p></div>
    <div class="seek"><span id="cur">0:00</span><input type="range" id="seek" min="0" max="1000" value="0" aria-label="Progreso"><span id="dur">0:00</span></div>
    <div class="ctrl">
      <button id="pFav" aria-label="Favorita" aria-pressed="false"><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"/></svg></button>
      <button id="prev" aria-label="Anterior"><svg viewBox="0 0 24 24" width="26" height="26" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polygon points="19 20 9 12 19 4 19 20" fill="currentColor"/><line x1="5" y1="19" x2="5" y2="5"/></svg></button>
      <button id="play" class="main" aria-label="Reproducir">▶</button>
      <button id="next" aria-label="Siguiente"><svg viewBox="0 0 24 24" width="26" height="26" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polygon points="5 4 15 12 5 20 5 4" fill="currentColor"/><line x1="19" y1="5" x2="19" y2="19"/></svg></button>
      <button id="pMore" aria-label="Más opciones"><svg viewBox="0 0 24 24" width="22" height="22" fill="currentColor" aria-hidden="true"><circle cx="12" cy="5" r="1.9"/><circle cx="12" cy="12" r="1.9"/><circle cx="12" cy="19" r="1.9"/></svg><span id="spLbl"></span></button>
    </div>
    <div class="extra">
      <button class="pbtn" id="pEq" aria-label="Ecualizador"><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><line x1="4" x2="4" y1="21" y2="14"/><line x1="4" x2="4" y1="10" y2="3"/><line x1="12" x2="12" y1="21" y2="12"/><line x1="12" x2="12" y1="8" y2="3"/><line x1="20" x2="20" y1="21" y2="16"/><line x1="20" x2="20" y1="12" y2="3"/><line x1="2" x2="6" y1="14" y2="14"/><line x1="10" x2="14" y1="8" y2="8"/><line x1="18" x2="22" y1="16" y2="16"/></svg></button>
      <button class="pbtn" id="pMode" aria-label="Modo de reproducción"></button>
    </div>
  </section>

  <section class="lib">
    <div class="bar"><h1>Vinilo</h1><button class="add" id="addBtn">+ Añadir</button><button class="add alt" id="dirBtn">Carpeta</button><button class="gear" id="gear" aria-label="Ajustes"><svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12.22 2h-.44a2 2 0 0 0-2 2v.18a2 2 0 0 1-1 1.73l-.43.25a2 2 0 0 1-2 0l-.15-.08a2 2 0 0 0-2.73.73l-.22.38a2 2 0 0 0 .73 2.73l.15.1a2 2 0 0 1 1 1.72v.51a2 2 0 0 1-1 1.74l-.15.09a2 2 0 0 0-.73 2.73l.22.38a2 2 0 0 0 2.73.73l.15-.08a2 2 0 0 1 2 0l.43.25a2 2 0 0 1 1 1.73V20a2 2 0 0 0 2 2h.44a2 2 0 0 0 2-2v-.18a2 2 0 0 1 1-1.73l.43-.25a2 2 0 0 1 2 0l.15.08a2 2 0 0 0 2.73-.73l.22-.39a2 2 0 0 0-.73-2.73l-.15-.08a2 2 0 0 1-1-1.74v-.5a2 2 0 0 1 1-1.74l.15-.09a2 2 0 0 0 .73-2.73l-.22-.38a2 2 0 0 0-2.73-.73l-.15.08a2 2 0 0 1-2 0l-.43-.25a2 2 0 0 1-1-1.73V4a2 2 0 0 0-2-2z"/><circle cx="12" cy="12" r="3"/></svg></button></div>
    <input type="file" id="file" accept="audio/*,.mp3,.m4a,.wav,.ogg,.flac,.aac,.opus" multiple hidden>
    <input type="file" id="dir" webkitdirectory multiple hidden>
    <input class="search" id="q" type="search" placeholder="Buscar canción" aria-label="Buscar">
    <div class="chips"><button class="chip on" id="fAll">Todas</button><button class="chip" id="fFav">♥ Favoritas</button></div>
    <div class="count" id="count"></div>
    <ul id="list"></ul>
  </section>
  <div class="mini" id="mini">
    <div class="mprog" id="mprog"></div>
    <button class="mt" id="mOpen" aria-label="Abrir reproductor"><span class="md" id="md"></span><span class="mtx"><b id="mTitle"></b><small>Toca para abrir</small></span></button>
    <button class="ic pl" id="mPlay" aria-label="Reproducir/Pausar"></button>
    <button class="ic" id="mNext" aria-label="Siguiente"><svg viewBox="0 0 24 24" width="26" height="26" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polygon points="5 4 15 12 5 20 5 4" fill="currentColor"/><line x1="19" y1="5" x2="19" y2="19"/></svg></button>
  </div>
</div>
<div class="sheet" id="set"><div class="box"><h3>Ajustes</h3>
  <button class="row" id="sSleep"><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg><span class="rl">Temporizador para dormir</span><span class="rv" id="sleepVal">Desactivado</span><svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="var(--mute)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m9 18 6-6-6-6"/></svg></button>
</div></div>
<div class="sheet" id="eq"><div class="box"><h3>Ecualizador</h3><div class="pres" id="pres"></div><div id="eqRows"></div></div></div>
<div class="toast" id="toast"></div>
<div class="sheet" id="sheet"><div class="box"><h3>Temporizador de sueño</h3>
  <button data-m="15">15 minutos</button><button data-m="30">30 minutos</button><button data-m="45">45 minutos</button><button data-m="60">1 hora</button>
  <button data-m="eot">Al terminar esta canción</button><button data-m="0" class="off" id="sOff">Desactivar</button></div></div>
<div class="sheet" id="menu"><div class="box">
  <div class="mh"><span class="mthumb" id="mThumb"></span><div class="mht"><b id="mhT">Vinilo</b><small id="mhA"></small></div></div>
  <button class="row" id="mSpeed"><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m12 14 4-4"/><path d="M3.34 19a10 10 0 1 1 17.32 0"/></svg><span class="rl">Velocidad de reproducción</span><span class="rv" id="spdVal">Normal</span><svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="var(--mute)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m9 18 6-6-6-6"/></svg></button>
</div></div>
<div class="sheet" id="spd"><div class="box"><h3>Velocidad de reproducción</h3><div id="spdList"></div></div></div>
<audio id="a" preload="metadata"></audio>

<script>
const $=s=>document.querySelector(s);
const audio=$('#a');
let db,songs=[],cur=null,shuffle=false,repeat=0,url=null,drag=false;
// Preferencias guardadas (favoritos y última canción)
const LS={get(k,d){try{const v=localStorage.getItem(k);return v==null?d:JSON.parse(v)}catch(e){return d}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};
const favs=new Set(LS.get('vin_fav',[]).map(String));
let onlyFav=false,restored=false,lastSave=0;
const isFav=s=>favs.has(String(s.id));
function toggleFav(s){const k=String(s.id);favs.has(k)?favs.delete(k):favs.add(k);LS.set('vin_fav',[...favs]);render();ui()}
function saveLast(){if(cur!==null)LS.set('vin_last',{id:cur,pos:audio.currentTime||0})}

// ---------- Almacenamiento (IndexedDB): la biblioteca se queda guardada ----------
const open=()=>new Promise((ok,no)=>{const r=indexedDB.open('vinilo',1);r.onupgradeneeded=()=>r.result.createObjectStore('songs',{keyPath:'id',autoIncrement:true});r.onsuccess=()=>ok(r.result);r.onerror=()=>no(r.error)});
const store=m=>db.transaction('songs',m).objectStore('songs');
const wrap=r=>new Promise((ok,no)=>{r.onsuccess=()=>ok(r.result);r.onerror=()=>no(r.error)});
async function load(){
  const all=await wrap(store('readonly').getAll());
  const k=new Set(nat.map(x=>x.name+'|'+x.size));
  songs=nat.concat(all.filter(x=>!k.has(x.name+'|'+x.size)));
  songs.sort((a,b)=>dsp(a).t.localeCompare(dsp(b).t));
  render();migrate();
  if(!restored&&cur===null)tryRestore();
}
function tryRestore(){
  const l=LS.get('vin_last',null);if(!l)return;
  const s=songs.find(x=>String(x.id)===String(l.id));if(!s)return;
  restored=true;
  if(s.uri)audio.src=Capacitor.convertFileSrc(s.uri);else if(s.blob){url=URL.createObjectURL(s.blob);audio.src=url}else return;

function coverColor(u){return new Promise(res=>{
  const im=new Image();
  im.onload=()=>{try{
    const c=document.createElement('canvas');c.width=c.height=32;const x=c.getContext('2d');x.drawImage(im,0,0,32,32);

async function readTags(file){
  try{
    const h=new Uint8Array(await file.slice(0,10).arrayBuffer());
    if(String.fromCharCode(h[0],h[1],h[2])!=='ID3')return{};

      let len;
      if(ver===2)len=(buf[p+3]<<16)|(buf[p+4]<<8)|buf[p+5];
      else if(ver===4)len=((buf[p+4]&127)<<21)|((buf[p+5]&127)<<14)|((buf[p+6]&127)<<7)|(buf[p+7]&127);

let sleepT=null,sleepEnd=0,sleepEOT=false;
function updSleep(){
  $('#sleepVal').textContent=sleepEnd?Math.max(1,Math.ceil((sleepEnd-Date.now())/60000))+' min':sleepEOT?'Al terminar la canción':'Desactivado';
  $('#gear').classList.toggle('on',!!(sleepEnd||sleepEOT));
}
function setSleep(m){
  clearTimeout(sleepT);sleepT=null;sleepEnd=0;sleepEOT=false;audio.volume=1;
  if(m==='eot')sleepEOT=true;
  else if(m>0){sleepEnd=Date.now()+m*60000;sleepT=setTimeout(sleepNow,m*60000)}
  updSleep();
}
function sleepNow(){audio.pause();setSleep(0)}
$('#gear').onclick=()=>$('#set').classList.add('show');
$('#set').onclick=e=>{if(e.target.id==='set')$('#set').classList.remove('show')};
$('#sSleep').onclick=()=>{$('#set').classList.remove('show');$('#sheet').classList.add('show')};
$('#sheet').onclick=e=>{
  const b=e.target.closest('button');
  if(b)setSleep(b.dataset.m==='eot'?'eot':+b.dataset.m);
  if(b||e.target.id==='sheet')$('#sheet').classList.remove('show');
};

document.addEventListener('keydown',e=>{
  if(e.target.tagName==='INPUT'&&e.target.type!=='range')return;
  if(e.code==='Space'){e.preventDefault();toggle()}
  if(e.code==='ArrowRight')audio.currentTime+=5;
  if(e.code==='ArrowLeft')audio.currentTime-=5;
});

// ---------- Visualizador ----------
let ac,an,started=false;
function startViz(){
  if(started)return;started=true;
  try{
    ac=new (window.AudioContext||window.webkitAudioContext)();
    const src=ac.createMediaElementSource(audio);an=ac.createAnalyser();an.fftSize=64;
    eqNodes=EQF.map((f,i)=>{const n=ac.createBiquadFilter();n.type=i===0?'lowshelf':i===4?'highshelf':'peaking';n.frequency.value=f;if(i>0&&i<4)n.Q.value=1;n.gain.value=eqv[i];return n});
    let nd=src;eqNodes.forEach(n=>{nd.connect(n);nd=n});nd.connect(an);an.connect(ac.destination);draw();
  }catch(e){}
}
function draw(){
  requestAnimationFrame(draw);
  const c=$('#viz'),x=c.getContext('2d'),w=c.width=c.clientWidth*devicePixelRatio,h=c.height=c.clientHeight*devicePixelRatio;
  if(ac&&ac.state==='suspended')ac.resume();
  const d=new Uint8Array(an.frequencyBinCount);an.getByteFrequencyData(d);
  const n=28,g=w/n,bw=g*.62;
  const grad=x.createLinearGradient(0,h,0,0);grad.addColorStop(0,vizBot);grad.addColorStop(1,vizTop);
  x.clearRect(0,0,w,h);x.fillStyle=grad;
  for(let i=0;i<n;i++){
    const v=d[Math.floor(i*d.length/n)]/255,bh=Math.max(3*devicePixelRatio,v*h);
    x.beginPath();x.roundRect?x.roundRect(i*g+(g-bw)/2,h-bh,bw,bh,bw/2):x.rect(i*g,h-bh,bw,bh);x.fill();
  }
}

// ---------- App Android (Capacitor): lee la música del teléfono ----------
const NATIVE=!!(window.Capacitor&&Capacitor.isNativePlatform&&Capacitor.isNativePlatform());
const ML=NATIVE?(Capacitor.registerPlugin?Capacitor.registerPlugin('MusicLibrary'):Capacitor.Plugins.MusicLibrary):null;
if(NATIVE)document.querySelector('.bar h1').insertAdjacentHTML('beforeend',' <small style="font:12px system-ui;color:var(--acc)">Android</small>');
if(NATIVE)document.querySelectorAll('#addBtn,#dirBtn').forEach(b=>b.remove());
// Notificación de música (carátula, tiempo y controles) + segundo plano
const blobB64=b=>new Promise(r=>{const f=new FileReader();f.onload=()=>r(String(f.result).split(',')[1]||'');f.onerror=()=>r('');f.readAsDataURL(b)});
function pushMedia(c){
  if(!NATIVE||cur===null)return;
  const s=songs.find(x=>x.id===cur);if(!s)return;const d=dsp(s);
  const o={title:d.t,artist:d.a||'Vinilo',playing:!audio.paused,speed:audio.playbackRate||1,pos:audio.currentTime||0,dur:isFinite(audio.duration)?audio.duration:0};
  if(c!==undefined)o.cover=c;
  ML.updateMedia(o).catch(()=>{});
}
if(NATIVE){
  audio.addEventListener('play',()=>{ML.keepAlive({on:true}).catch(()=>{});pushMedia()});
  ['pause','seeked','loadedmetadata','ratechange'].forEach(ev=>audio.addEventListener(ev,()=>pushMedia()));
  try{ML.addListener('mediaAction',e=>{
    if(e.action==='play')audio.play();
    else if(e.action==='pause')audio.pause();
    else if(e.action==='next')step(1);
    else if(e.action==='prev')step(-1);
    else if(e.action==='seek')audio.currentTime=e.pos;
  })}catch(e){}
}
let nat=[],scanning=false,covering=false;
async function scanPhone(){
  if(scanning)return;scanning=true;
  try{
    $('#count').textContent='Buscando música en tu teléfono…';
    const p=await ML.requestAccess();
    if(!p.granted){$('#count').textContent='Permite el acceso a tu música para ver tus canciones';return}
    const r=await ML.scan();
    const old=new Map(nat.map(x=>[x.id,x]));
    nat=r.songs.filter(x=>!/^(AUD|PTT)-\d{8}-WA\d+/i.test(x.displayName||'')).map(x=>{
      const id='n'+x.id,nm=(x.displayName||x.title||'').replace(/\.[^.]+$/,'');
      return Object.assign(old.get(id)||{},{id,name:nm,title:(x.title&&x.title!==nm)?x.title:'',artist:(x.artist&&x.artist!=='<unknown>')?x.artist:'',size:x.size,uri:x.uri,native:true,tg:1});
    });
    await load();
    if(!nat.length)$('#count').textContent='Android no encontró música en el teléfono';
    loadCovers();
  }catch(e){$('#count').textContent='No se pudo leer la música: '+((e&&e.message)||e)}
  finally{scanning=false}
}
async function loadCovers(){
  if(covering)return;covering=true;let n=0;
  try{
    for(const s of nat){
      if(s.cover||s.nc)continue;
      try{
        const r=await ML.cover({uri:s.uri});
        if(r.data){s.cover=await (await fetch('data:image/jpeg;base64,'+r.data)).blob();n++;if(n%25===0)render()}else s.nc=true;
      }catch(e){s.nc=true}
    }
  }finally{covering=false}
  render();const c=songs.find(x=>x.id===cur);if(c)meta(c);
}
// al volver a la app, busca las canciones nuevas
document.addEventListener('visibilitychange',()=>{if(!document.hidden&&NATIVE&&db)scanPhone()});
